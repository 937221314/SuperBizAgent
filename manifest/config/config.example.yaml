# SuperBizAgent 配置示例
#
# 使用方式：
#   cp manifest/config/config.example.yaml manifest/config/config.yaml
#   然后按实际环境修改 manifest/config/config.yaml。
#
# 说明：真实的 manifest/config/config.yaml 已在 .gitignore 中忽略，不会纳入版本控制，
#       以免把密码等敏感信息提交到仓库。
#
# 以下环境变量可覆盖对应配置项（优先级：环境变量 > 配置文件 > 代码默认值）：
#   MILVUS_ADDRESS、MILVUS_USERNAME、MILVUS_PASSWORD、MILVUS_DB_NAME、MILVUS_COLLECTION_NAME
#   TEXT_EMBEDDING_API_KEY、TEXT_EMBEDDING_BASE_URL、TEXT_EMBEDDING_MODEL
#   MYSQL_DANGEROUS_STATEMENT_MODE
#   PROMETHEUS_BASE_URL
# 另外可通过 CONFIG_PATH 指定配置文件的绝对路径。

# server
server:
  address: ":8080"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# logger
logger:
  level: "all"
  stdout: true

# dashscope_chat_plus
dashscope_chat_plus:
  api_key: "DASHSCOPE_API_KEY"
  base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  model: "qwen3.7-plus"

# dashscope_chat_flash
dashscope_chat_flash:
  api_key: "DASHSCOPE_API_KEY"
  base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  model: "qwen3.6-flash"

# embedder
# 由 internal/config 加载（不再使用 gf 的 g.Cfg）
text-embedding:
  api_key: "DASHSCOPE_API_KEY"
  base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  model: "qwen3.7-text-embedding"

# Milvus 向量数据库
milvus:
  # 服务地址，格式为 host:port
  address: "127.0.0.1:19530"
  # 认证用户名
  username: "root"
  # 认证密码，建议留空并通过环境变量 MILVUS_PASSWORD 注入
  password: ""
  # 初始化时使用的默认数据库
  default_db_name: "default"
  # 业务数据库名称，不存在时自动创建
  db_name: "agent"
  # 业务集合名称，不存在时自动创建
  collection_name: "biz"
  # 向量维度，必须与所用 Embedding 模型的输出维度一致
  vector_dim: 1024

# mcp
mcp_url: "http://localhost:3000/sse"

# Prometheus 告警工具（query_prometheus_alerts）
prometheus:
  # Prometheus 服务地址，使用前自行启动 Prometheus 容器
  base_url: "http://127.0.0.1:9090"

# MySQL 工具（mysql_query / mysql_exec）
mysql:
  # mysql_exec 遇到 DROP/TRUNCATE 时的行为：
  #   deny      直接拒绝，返回 cancelled 结果（默认）
  #   interrupt 挂起调用，等用户确认后执行
  # interrupt 需要编排层支持 checkpoint 与恢复（ToolsNode + CheckPointStore + 恢复入口），
  # 三者未就绪时挂起会变成无人处理的打断信号，因此默认 deny。
  dangerous_statement_mode: "deny"
